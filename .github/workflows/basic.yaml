# This is a basic workflow to get help you get started with GitHub Actions
name: CI
# Controls when the Workflow will run
on:
  # Triggers the Workflow on push or pull request Events but only for the "master" branch
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# A Workflow Run is made up of one or more Jobs that can run sequentially or in parallel
jobs:
  # This job does the core processing
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run a one-line script
        run: echo "Hello, world!"

      - name: Run a multi-line script
        run: |-
          echo "Add other actions to build,"
          echo "test, and deploy your project."

      - name: Get date
        id: get-date
        run: |
          echo "::set-output name=date::$( /bin/date -u "+%Y-%m-%d" )"
        shell: bash

      - name: Cache some data
        uses: actions/cache@v3
        with:
          path: |
            foo.txt
            bar.txt
          key: ${{ runner.os }}_${{ steps.get-date.outputs.date }}_${{ hashFiles('foo.txt', 'bar.txt') }}
          restore-keys: |
            ${{ runner.os }}_${{ steps.get-date.outputs.date }}_
